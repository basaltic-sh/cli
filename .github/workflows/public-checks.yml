# Generated by the public release publisher. Publication happens in GitLab.
name: Public source checks

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOWORK: "off"
  GOTOOLCHAIN: local

jobs:
  source:
    name: Go ${{ matrix.go || 'go.mod minimum' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ["", "stable"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          go-version-file: go.mod
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  generator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: internal/gen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
