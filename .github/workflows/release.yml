name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # goreleaser creates the release and uploads assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # goreleaser builds its changelog from the commits since the previous
          # tag, so it needs the history and the tags.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      # A tag that does not build is a tag that has to be deleted, and a
      # deleted tag is cached by everything that already fetched it. Cheaper to
      # find out here.
      - name: Test before releasing
        run: go test ./...

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
