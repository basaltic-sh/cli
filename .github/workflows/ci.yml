name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

  release-contract:
    # goreleaser, install.sh and internal/selfupdate all construct the release
    # asset names, and nothing else compares them. A rename in one would break
    # `basaltic upgrade` and `curl | sh` for everyone already installed, with
    # every other check still green. Caught here, before a tag is cut.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          install-only: true
      - run: scripts/check-release-contract.sh

  generator:
    # The generator is a module of its own with no dependencies, so it builds
    # and tests without any access to the SDK.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/gen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
